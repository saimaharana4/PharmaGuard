package:images:
  extends: .gcp
  stage: package
  resource_group: hackathon-image-packaging
  services:
    - name: docker:28-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apt-get update && apt-get install -y docker.io
    - bash ci/build_images.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  artifacts:
    reports:
      dotenv: images.env
