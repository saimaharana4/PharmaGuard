security:python:
  extends: .python
  stage: secure
  script:
    - uv export --frozen --no-dev --extra embeddings --no-emit-project > /tmp/requirements.txt
    - uv run pip-audit -r /tmp/requirements.txt --disable-pip
    - uv run python ci/audit_torch.py
security:web:
  extends: .web
  stage: secure
  script: ["pnpm audit --prod --audit-level=high"]
security:secrets:
  image:
    name: zricethezav/gitleaks:v8.30.0
    entrypoint: [""]
  stage: secure
  script: ["gitleaks dir . --redact --exit-code 1"]
