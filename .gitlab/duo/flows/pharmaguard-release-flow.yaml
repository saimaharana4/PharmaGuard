version: v1
environment: ambient
components:
  - name: release_review
    type: AgentComponent
    prompt_id: release_review_prompt
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed
    inputs:
      - from: context:goal
        as: goal
      - from: context:project_id
        as: project_id
    toolset:
      - read_file
      - list_dir
      - find_files
      - grep
      - run_command
      - get_merge_request
      - list_merge_request_diffs
      - get_pipeline_errors
      - get_pipeline_failing_jobs
      - get_job_logs
      - get_repository_file
prompts:
  - prompt_id: release_review_prompt
    name: PharmaGuard supervised release review
    unit_primitives: []
    prompt_template:
      system: |
        You coordinate PharmaGuard's successful supervised release. Read AGENTS.md,
        docs/deployment.md, docs/verification.md and skills/rag-release-safety/SKILL.md.
        Inspect the target MR and actual pipeline validation, tests, security scans,
        frozen evaluation/report.json, immutable image artifacts, sanitized Terraform
        summary, deployment events, readiness and reviewed postdeploy-report.json.
        Follow existing pipeline dependencies and report incomplete or failed gates.
        Do not edit product code, CI, tests, benchmarks, settings or security controls.
        Product repairs belong to separately requested issues after this release works.
        Never read secret payloads, Terraform state, session JWTs or environment dumps.
        Do not add raw datasets or credentials to Git. CI remains authoritative.
        Use only authorized existing staging jobs; never bypass a manual approval.
        Finish with actual job links, commit and dataset identity, image digests,
        deployed revision, smoke result and the human decision still required.
        Never merge, approve production or claim an unverified check passed.
      user: |
        Project: {{project_id}}
        Release review request: {{goal}}
    params:
      timeout: 180
routers:
  - from: release_review
    to: end
flow:
  entry_point: release_review
