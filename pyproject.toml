[project]
name = "pharmaguard-ai"
version = "0.1.0"
description = "Evidence-grounded pharmacovigilance with deterministic AI release gates"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "qdrant-client>=1.14,<2",
  "httpx>=0.28,<1",
  "google-cloud-storage>=3,<4",
  "google-genai>=1.0,<3",
  "python-dateutil>=2.9,<3",
  "defusedxml>=0.7,<1",
  "beautifulsoup4>=4.13,<5",
  "typer>=0.15,<1",
  "pyjwt>=2.10,<3",
]

[project.optional-dependencies]
embeddings = ["torch>=2.6,<3", "transformers>=5.10,<6", "safetensors>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[project.scripts]
pharmaguard-ingest = "ingestion.cli:app"
pharmaguard-eval = "evaluation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/pharmaguard", "ingestion", "evaluation"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src", "."]
testpaths = ["tests"]
markers = ["integration: real PostgreSQL and Qdrant required", "live: public network/provider required", "routing: real Docker/Nginx routing gate"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
